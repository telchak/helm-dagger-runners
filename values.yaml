# =============================================================================
# Dagger Runners Helm Chart — values.yaml
# =============================================================================

# -- CI provider. Currently only "github" is implemented.
# Future: "gitlab" for GitLab Runner integration.
provider: github

# =============================================================================
# Dagger Engine
# =============================================================================

# -- List of Dagger engine versions to deploy. Each version gets its own
# engine instance and corresponding runner scale sets.
# Runner labels are auto-generated:
#   - dagger-v0.20.3  (exact match)
#   - dagger-v0.20    (minor alias, points to latest patch in that minor)
#   - dagger-latest   (always the highest version in this list)
daggerVersions:
  - "0.20.3"

# -- Engine deployment mode.
# "statefulset": one engine per version with PVC cache (recommended).
# "daemonset":   one engine per node with ephemeral hostPath cache.
engineMode: statefulset

engine:
  image:
    registry: registry.dagger.io
  resources:
    requests:
      cpu: "250m"
      memory: "8Gi"
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

# -- Persistent cache settings (statefulset mode only).
persistentCache:
  size: "100Gi"
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

# -- Dagger Cloud token for Magicache distributed caching.
# Leave empty to disable.
daggerCloudToken: ""

# -- Namespace where the ARC controller is deployed.
arcControllerNamespace: "arc-systems"
# -- Service account name of the ARC controller.
arcControllerServiceAccount: "arc-controller-gha-rs-controller"

# -- ARC controller version deployed in the cluster.
# Must match the gha-runner-scale-set-controller chart version — ARC deletes
# AutoscalingRunnerSet objects whose app.kubernetes.io/version label does not
# match the controller's own build version.
arcControllerVersion: ""

# =============================================================================
# GitHub Provider Configuration
# =============================================================================

# -- GitHub scopes to serve runners for.
#
# Every entry gets its own set of scale sets (exact version, minor alias and
# latest alias) against the SAME Dagger engines. The engine is the expensive
# part — a StatefulSet with a 100Gi cache PVC and a multi-Gi memory
# reservation — while a scale set is a handful of small pods, so serving
# several orgs from one engine costs far less than one deployment per org.
#
# Runner labels are per GitHub scope, so every config exposes the same
# `dagger-v<version>` labels without colliding: a workflow in one org can never
# see another org's runners. Only the Kubernetes object names must be unique,
# which is what namePrefix handles.
#
# Example:
#   githubConfigs:
#     - name: daggerverse
#       namePrefix: ""                       # keep pre-0.3.0 object names
#       configUrl: https://github.com/telchak/daggerverse
#       app:
#         existingSecretName: gh-app-credentials
#     - name: secplane
#       configUrl: https://github.com/secplane   # org-wide: every repo
#       app:
#         existingSecretName: gh-app-secplane
#       runner:
#         minRunners: 4                      # override the global default
#
# Per-entry fields:
#   name         (required) identifies the config in labels; prefixes object
#                names unless namePrefix is set.
#   configUrl    (required) GitHub org URL for org-wide runners, or a
#                repository URL to scope them to a single repo.
#   namePrefix   (optional) overrides the "<name>-" object-name prefix. Set to
#                "" to keep names unprefixed — needed when adding a second
#                config to an existing release, since renaming a live
#                AutoscalingRunnerSet deletes and recreates it.
#   app          (optional) per-config credentials; falls back to github.app.
#   runner       (optional) per-config minRunners/maxRunners/aliasMinRunners.
#
# Leave empty to use the legacy single-config `github` block below.
githubConfigs: []

# -- Legacy single-config form. Used only when githubConfigs is empty.
# Prefer githubConfigs, which supports one or many scopes.
github:
  # -- GitHub organization or repository URL.
  configUrl: ""

  # -- GitHub App authentication.
  app:
    id: ""
    installationId: ""
    privateKey: ""
    # -- Use an existing secret instead of creating one from values above.
    # The secret must contain keys: github_app_id, github_app_installation_id,
    # github_app_private_key.
    existingSecretName: ""
    # -- Name for the auto-created secret (when existingSecretName is empty).
    secretName: "gh-app-pre-defined-secret"

# =============================================================================
# Runner Configuration
# =============================================================================

runner:
  # -- Container image for the GitHub Actions runner.
  #
  # MUST be a pinned tag or digest, never `:latest`.
  #
  # Runner pods use imagePullPolicy: IfNotPresent, because Always with dozens of
  # pods starting at once exceeds registry pull QPS. The consequence is that a
  # floating tag freezes: every node keeps serving whatever it cached first and
  # never sees a new push, indefinitely and silently.
  #
  # That is not merely stale. Runner 2.334.0 makes the ARC controller mark
  # healthy, running runners Outdated — tearing down the runner, the
  # EphemeralRunnerSet, the listener and the GitHub registration, then stranding
  # the AutoscalingRunnerSet in Outdated permanently. No runners, no error in
  # the logs, and every job queued forever.
  # See https://github.com/actions/actions-runner-controller/issues/4596 — it
  # reproduces on controller 0.14.0, 0.14.1 and 0.14.2 alike, because the runner
  # version is the variable, not the controller.
  #
  # Bump this deliberately; `helm upgrade` is how runners get updated here.
  image: "ghcr.io/actions/actions-runner:2.336.0"

  # -- Minimum runners per exact-version scale set.
  minRunners: 18
  # -- Maximum runners per scale set.
  maxRunners: 18
  # -- Minimum runners for alias scale sets (minor + latest).
  # When null, inherits minRunners.
  aliasMinRunners: 0

  # -- Size templates for runner pods. Each key becomes a label suffix.
  # Use "" (empty string key) for the default size (no suffix).
  # Runner pods are lightweight — all build work is offloaded to the Dagger engine.
  sizeTemplates:
    "":
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits: {}

# =============================================================================
# Pod Cleanup CronJob
# =============================================================================

podCleanup:
  enabled: true
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

# =============================================================================
# Images
# =============================================================================

# -- kubectl image used by the cleanup CronJob and the StatefulSet init
# container.
#
# Pinned by digest rather than tag: Bitnami retired versioned tags on Docker Hub,
# leaving only `latest`, and `latest` combined with imagePullPolicy IfNotPresent
# freezes on whatever each node cached first. A digest is immutable, so
# IfNotPresent is exactly right for it.
#
# This digest is kubectl 1.36.3. To refresh:
#   skopeo inspect docker://docker.io/bitnami/kubectl:latest | jq -r .Digest
kubectlImage: "bitnami/kubectl@sha256:f0c03a7e99bd3b22085328bf747082d8d689f362dac4b1277dc9b6a85c07fce4"

# -- Escape hatch for the pinned-image check.
#
# Every image here is pulled with IfNotPresent, so a floating tag such as
# `:latest` freezes on whatever each node cached first and can never be updated.
# The chart refuses to render in that case. Set this to true only if you
# genuinely want that behaviour and understand the consequence.
allowFloatingTags: false
