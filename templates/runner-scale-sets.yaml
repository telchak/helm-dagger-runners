{{- if eq .Values.provider "github" }}
{{/*
Runner Scale Sets — AutoscalingRunnerSet CRs for ARC.

For each GitHub config, generates the following runner labels:
  - dagger-v0.21.8       (exact version)
  - dagger-v0.21         (minor alias → latest patch in that minor)
  - dagger-latest        (always the highest version)

Each is cross-multiplied with sizeTemplates (if defined).

Labels are per GitHub scope, so two configs may both expose `dagger-v0.21.8`
without colliding — a workflow in one org can never see another org's runners.
Only the Kubernetes object names have to be unique, which is what namePrefix
is for.

Every scale set renders through the dagger-runners.scaleSet helper; the pod
spec lives there exactly once.
*/}}

{{- $root := . }}

{{/* Fail fast on floating tags — see the helper for why this is fatal here. */}}
{{- if not .Values.allowFloatingTags }}
{{- include "dagger-runners.requirePinnedImage" (dict "image" .Values.runner.image "field" "runner.image") }}
{{- include "dagger-runners.requirePinnedImage" (dict "image" .Values.kubectlImage "field" "kubectlImage") }}
{{- end }}

{{/*
Normalize the config list.

githubConfigs is the current form. When it is empty we synthesize a single
entry from the legacy top-level `github` block, with an empty namePrefix, so
that charts upgrading from <=0.2.0 keep their existing object names. Renaming a
live AutoscalingRunnerSet deletes and recreates it, dropping every runner
registration with it, so this fallback is load-bearing rather than cosmetic.
*/}}
{{- $configs := list }}
{{- if .Values.githubConfigs }}
  {{- range $i, $cfg := .Values.githubConfigs }}
    {{- if not $cfg.configUrl }}
    {{- fail (printf "\n\ngithubConfigs[%d] has no configUrl.\n\nEach entry needs the GitHub org or repository URL the runners register against, e.g.\n  githubConfigs:\n    - name: secplane\n      configUrl: https://github.com/secplane\n" $i) }}
    {{- end }}
    {{- if not $cfg.name }}
    {{- fail (printf "\n\ngithubConfigs[%d] (%s) has no name.\n\nname identifies the config in labels and, unless namePrefix is set explicitly, prefixes the Kubernetes object names so multiple configs can coexist.\n" $i $cfg.configUrl) }}
    {{- end }}
    {{/* namePrefix defaults to "<name>-"; set it to "" to keep unprefixed names. */}}
    {{- $prefix := $cfg.name | printf "%s-" }}
    {{- if hasKey $cfg "namePrefix" }}
    {{- $prefix = $cfg.namePrefix }}
    {{- end }}
    {{- $configs = append $configs (merge (dict "_prefix" $prefix) $cfg) }}
  {{- end }}
{{- else }}
  {{- if not .Values.github.configUrl }}
  {{- fail "\n\nNo GitHub config found.\n\nSet githubConfigs (preferred):\n  githubConfigs:\n    - name: myorg\n      configUrl: https://github.com/myorg\n      app:\n        existingSecretName: gh-app-credentials\n\nor the legacy single-config github.configUrl.\n" }}
  {{- end }}
  {{- $configs = list (dict "_prefix" "" "name" "" "configUrl" .Values.github.configUrl "app" .Values.github.app "runner" dict) }}
{{- end }}

{{/* Reject duplicate object-name prefixes — Helm would silently render two
     objects with the same name and only the last would survive. */}}
{{- $seenPrefixes := dict }}
{{- range $cfg := $configs }}
  {{- if hasKey $seenPrefixes $cfg._prefix }}
  {{- fail (printf "\n\nTwo githubConfigs resolve to the same object-name prefix %q (%s and %s).\n\nGive each config a distinct name, or set namePrefix explicitly.\n" $cfg._prefix (get $seenPrefixes $cfg._prefix) $cfg.configUrl) }}
  {{- end }}
  {{- $_ := set $seenPrefixes $cfg._prefix $cfg.configUrl }}
{{- end }}

{{- range $cfg := $configs }}
{{- $runnerCfg := $cfg.runner | default dict }}
{{- $minRunners := $runnerCfg.minRunners | default $root.Values.runner.minRunners }}
{{- $aliasMinRunners := $runnerCfg.aliasMinRunners | default $root.Values.runner.aliasMinRunners }}

{{- /*
Versions this config gets scale sets for: its own daggerVersions when set,
otherwise the global list. The minor and latest aliases are resolved within
this list, so pinning one org to a new engine (a beta, say) never moves
another org's dagger-latest onto it, nor gives that org a scale set it did
not ask for.
*/}}
{{- $versions := $cfg.daggerVersions | default $root.Values.daggerVersions }}
{{- if not $versions }}
{{- fail (printf "\n\ngithubConfigs entry %q has no Dagger versions.\n\nSet daggerVersions on the entry, or the global daggerVersions it falls back to.\n" ($cfg.name | default $cfg.configUrl)) }}
{{- end }}
{{- $sortedVersions := $versions | sortAlpha }}
{{- $latestVersion := last $sortedVersions }}

{{- /* Build a dict of minor -> latest patch version for alias dedup */}}
{{- $minorLatest := dict }}
{{- range $sortedVersions }}
  {{- $minor := include "dagger-runners.minorVersion" . }}
  {{- $_ := set $minorLatest $minor . }}
{{- end }}

{{/* === Exact version sets === */}}
{{- range $version := $sortedVersions }}
{{- $vDashed := replace "." "-" $version }}
{{- range $sizeName, $sizeConfig := $root.Values.runner.sizeTemplates }}
{{- $suffix := ternary (printf "-%s" $sizeName) "" (ne $sizeName "") }}
{{- include "dagger-runners.scaleSet" (dict
      "root" $root
      "config" $cfg
      "sizeConfig" $sizeConfig
      "engineVersion" $version
      "name" (printf "%sdagger-v%s%s" $cfg._prefix $vDashed $suffix)
      "scaleSetName" (printf "dagger-v%s%s" $version $suffix)
      "minRunners" $minRunners
      "extraLabels" (dict "dagger.io/version" $version)) }}
{{- end }}{{/* range sizeTemplates */}}
{{- end }}{{/* range exact versions */}}

{{/* === Minor alias sets === */}}
{{- range $minor, $version := $minorLatest }}
{{- if ne $minor $version }}{{/* skip if minor == version (no patch component) */}}
{{- $minorDashed := replace "." "-" $minor }}
{{- range $sizeName, $sizeConfig := $root.Values.runner.sizeTemplates }}
{{- $suffix := ternary (printf "-%s" $sizeName) "" (ne $sizeName "") }}
{{- include "dagger-runners.scaleSet" (dict
      "root" $root
      "config" $cfg
      "sizeConfig" $sizeConfig
      "engineVersion" $version
      "name" (printf "%sdagger-v%s-alias%s" $cfg._prefix $minorDashed $suffix)
      "scaleSetName" (printf "dagger-v%s%s" $minor $suffix)
      "minRunners" $aliasMinRunners
      "extraLabels" (dict "dagger.io/alias-for" $version)) }}
{{- end }}{{/* range sizeTemplates */}}
{{- end }}{{/* if ne minor version */}}
{{- end }}{{/* range minorLatest */}}

{{/* === Latest alias === */}}
{{- range $sizeName, $sizeConfig := $root.Values.runner.sizeTemplates }}
{{- $suffix := ternary (printf "-%s" $sizeName) "" (ne $sizeName "") }}
{{- include "dagger-runners.scaleSet" (dict
      "root" $root
      "config" $cfg
      "sizeConfig" $sizeConfig
      "engineVersion" $latestVersion
      "name" (printf "%sdagger-latest%s" $cfg._prefix $suffix)
      "scaleSetName" (printf "dagger-latest%s" $suffix)
      "minRunners" $aliasMinRunners
      "extraLabels" (dict "dagger.io/alias-for" $latestVersion)) }}
{{- end }}{{/* range sizeTemplates */}}

{{- end }}{{/* range configs */}}
{{- end }}{{/* if provider == github */}}
