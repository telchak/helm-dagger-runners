{{- if eq .Values.provider "github" }}
{{/*
GitHub App credentials.

Only rendered for configs that supply credentials inline. Anything using
app.existingSecretName is left alone — that is the path for SOPS-encrypted or
externally-managed secrets, and is what the schlag-family cluster uses.

Putting a private key in values means it lands in the Helm release secret in
plaintext, so existingSecretName is preferred for anything real.
*/}}
{{- if .Values.githubConfigs }}
{{- range $i, $cfg := .Values.githubConfigs }}
{{- $app := $cfg.app | default dict }}
{{- if and (not $app.existingSecretName) $app.privateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app.secretName | default (printf "%s-gh-app" $cfg.name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dagger-runners.labels" $ | nindent 4 }}
    dagger.io/github-config: {{ $cfg.name | quote }}
type: Opaque
data:
  github_app_id: {{ $app.id | toString | b64enc }}
  github_app_installation_id: {{ $app.installationId | toString | b64enc }}
  github_app_private_key: {{ $app.privateKey | b64enc }}
{{- end }}
{{- end }}
{{- else }}
{{- if not .Values.github.app.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.github.app.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dagger-runners.labels" . | nindent 4 }}
type: Opaque
data:
  github_app_id: {{ .Values.github.app.id | toString | b64enc }}
  github_app_installation_id: {{ .Values.github.app.installationId | toString | b64enc }}
  github_app_private_key: {{ .Values.github.app.privateKey | b64enc }}
{{- end }}
{{- end }}
{{- end }}
